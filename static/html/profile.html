<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chirp Social</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="../css/main.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="../js/editProfile.js" defer></script>
</head>
<body>
    <!-- Website banner -->
    <div id="banner-nav">
        <div id="banner-logo">
            <a><img id="logo" src="../../medias/chirpLogo.png"></a>
        </div>
        
        <div id="nav">
            <div id="home">
                <a><i class="bi bi-house"></i></a>
            </div>
            <div id="search">
                <a><i class="bi bi-search"></i></a>
            </div>
            <div id="followers">
                <a><i class="bi bi-people-fill"></i></a>
            </div>
        </div>
        
        <div id="profile-icon">
            <a><img id="icon" src="../../medias/defaultUser.webp"></a>
        </div>
    </div>

    <div id="center-content">
        <div id="profile">
            
            <div id="user-row">
                <div id="picture-name">
                    <img id="picture" src="../../medias/defaultUser.webp">
                    <p>@JohnDoe</p>
                </div>

                <div id="user-data">
                    <p id="date-joined">Joined February 22nd 2025</p>
                    <p id="following">1234 Following</p>
                    <p id="followers">12.78K Followers</p>
                </div>

                <div id="bio-btn">
                    <p>Former president of earth.</p>
                    <a><button id="followBtn" type="button">Follow</button></a>
                </div>
            </div>
        
            <div id="posts">
                <div id="all-posts">

                </div>
                <div id="reposts">
    
                </div>
                <div id="media">
    
                </div>
            </div>

            <div id="content">

            </div>

        </div>
    </div>

    <!-- Modal popup on successful user registration -->
	<div id="modal">
		<div id="modal-content">
		  <span id="close">&times;</span>
		  <p id="success">
		  </p>
		</div>  
	</div>
</body>
</html>
