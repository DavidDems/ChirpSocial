<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chirp Social</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="../css/main.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="../js/createPost.js" defer></script>
</head>
<body>
    <!-- Website banner -->
    <div id="banner-nav">
        <div id="banner-logo">
            <a><img id="logo" src="../../medias/chirpLogo.png"></a>
        </div>
        
        <div id="nav">
            <div id="home">
                <a href="home.html"><i class="bi bi-house"></i></a>
            </div><div id="createPost">
                <a><i class="bi bi-plus-circle"></i></a>
            </div>
            <div id="search">
                <a href="search.html"><i class="bi bi-search"></i></a>
            </div>
            <div id="followers">
                <a href="profile.html"><i class="bi bi-people-fill"></i></a>
            </div>
        </div>
        
        <div id="profile-icon">
            <a href="profile.html"><img id="icon" src="../../medias/defaultUser.webp"></a>
        </div>
    </div>

    <div class="center-content">
        <div class="posts-area" style="margin-top: 0;">
            
            <div class="posts-list">
                <div id="create-reply" class="posts">
                    <div class="post-profile">
                        <img class="picture" src="../../medias/defaultUser.webp">
                    </div>
                    <div id="reply-input" class="content">
                        <input id="reply-txt" type="text" placeholder="Create your post">
                        <div id="reply-btn">
                            <button>Post</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
