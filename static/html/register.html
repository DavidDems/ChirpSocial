<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chirp Social</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="../css/main.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="../js/createUser.js" defer></script>
</head>
<body>
    <!-- Website banner -->
    <div id="banner-logo">
        <img id="logo" src="../medias/chirpLogo.png">
    </div>

    <!-- User registration form -->
    <form id="register-form">
        <h2>Sign Up Form</h2>
        <label>Username:</label>
        <div>
            <input id="username" type="text">
            <p></p>
        </div>
        <label>Display Name:</label>
        <div>
            <input id="displayname" type="text">
            <p></p>
        </div>
        <label>Email:</label>
        <div>
            <input id="email" type="text" placeholder="example@mail.com">
            <p></p>
        </div>
        <label>Date of Birth:</label>
        <div>
            <input id="dob" type="text" placeholder="YYYY-MM-DD">
            <p></p>
        </div>
        <label>Password:</label>
        <div>
            <input id="password" type="password">
            <p></p>
        </div>
        <label>Re-enter Password:</label>
        <div>
            <input id="re-password" type="password">
            <p></p>
        </div>
        <button id="registerBtn" type="button">Register</button>
    </form>

    <!-- Modal popup on successful user registration -->
	<div id="modal">
		<div id="modal-content">
		  <span id="close">&times;</span>
		  <p id="success">
		  </p>
		</div>  
	</div>
</body>
</html>
