<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chirp Social</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="../css/main.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="../js/loginUser.js" defer></script>
</head>
<body>
    <!-- Website banner -->
    <div id="banner-logo">
        <img id="logo" src="../../medias/chirpLogo.png">
    </div>

    <!-- User login form -->
    <form id="login-form">
        <h2>Login</h2>
        <label for="email">Email:</label>
        <div>
            <input id="email" type="text">
            <p></p>
        </div>
        <label for="password">Password:</label>
        <div>
            <input id="password" type="password">
            <p></p>
        </div>
        <p id="register">Don&#39t have an account? <a id="register-link">Register Here!</a></p>
        <button id="loginBtn" type="button">Login</button>
    </form>

    <!-- Modal popup on unsuccessful user login -->
	<div id="modal">
		<div id="modal-content">
		  <span id="close">&times;</span>
		  <p id="error">
		  </p>
		</div>  
	</div>
</body>
</html>
